<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09101e"><title>Rocket League Training</title>
<style>
:root{--bg:#09101e;--p:#111d31;--p2:#172640;--ln:#263955;--tx:#f4f7fc;--mu:#91a2bb;--bl:#36a8ff;--or:#ff8a32;--gr:#43d69a;--rd:#ff6574;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 90% -10%,#173a61,transparent 40%),var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Roboto,sans-serif;padding-bottom:90px}
.w{max-width:720px;margin:auto;padding:16px}button,input,select{font:inherit}button{cursor:pointer}
h1{font-size:26px;font-style:italic;font-weight:900;margin:6px 0;line-height:1.1}h2{font-size:17px;margin:22px 2px 10px}
.hero{background:linear-gradient(130deg,#15375a,#10233e 60%,#382719);border:1px solid #315274;border-radius:22px;padding:20px}
.rk{font-size:24px;font-weight:900}.rk b{color:var(--or)}
.bar{height:9px;background:#ffffff20;border-radius:9px;overflow:hidden;margin-top:12px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--bl),var(--or));border-radius:9px;transition:width .4s}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}.c{background:linear-gradient(145deg,var(--p),#0e192a);border:1px solid var(--ln);border-radius:16px;padding:14px;min-width:0}
.l{font-size:12px;color:var(--mu)}.v{font-size:24px;font-weight:850;margin-top:2px}.bl{color:var(--bl)}.or{color:var(--or)}.gr{color:var(--gr)}.rd{color:var(--rd)}
.btn{border:0;border-radius:12px;padding:12px;font-weight:800;color:#061321;background:linear-gradient(100deg,#51bcff,#ff9b48);width:100%}
.btn.s{background:#1a2b43;color:#d8e9fb;border:1px solid #36506e}.btn.w2{background:var(--gr)}.btn.d{background:var(--rd);color:#2a0a10}
.row{display:flex;gap:8px;margin-top:10px}.row>*{flex:1}
.ex{padding:14px 0;border-bottom:1px solid #23334a}.ex:last-child{border:0}.ex h3{margin:0;font-size:15px}
.ex ul{margin:6px 0 0;padding-left:18px;color:#c4d5e8;font-size:13px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}
.tm{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
.chk{width:24px;height:24px;accent-color:var(--gr)}
.f{margin:10px 0}.f label{display:block;font-size:12px;color:var(--mu);margin-bottom:4px}
.f input,.f select{width:100%;background:#0b1626;border:1px solid #344a66;border-radius:10px;padding:11px;color:#fff}
.tag{font-size:11px;border-radius:99px;padding:3px 9px;background:#173d35;color:#7de5ba}.tag.o{background:#3a2a1c;color:#ffc48f}.tag.r{background:#44232d;color:#ff9ba6}
.nt{border:1px solid #66502f;background:#2c251c;color:#f4c997;border-radius:12px;padding:11px;font-size:12px;margin-top:12px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#0c1728f2;border-top:1px solid var(--ln);display:flex;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
.nav button{flex:1;background:none;border:0;color:#7f91aa;font-size:11px;font-weight:700;padding:4px 0}.nav button span{display:block;font-size:19px}.nav .on{color:#70c6ff}
.lg{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #25364d;font-size:13px}
.sk{display:flex;align-items:center;gap:8px;padding:8px 0}.sk b{flex:1;font-size:13px}.sk button{width:34px;height:34px;border-radius:10px;border:1px solid #36506e;background:#1a2b43;color:#fff;font-size:18px;flex:none}
.pips{display:flex;gap:3px}.pips i{width:14px;height:6px;border-radius:3px;background:#2a3d5a}.pips i.on{background:var(--or)}
.ach{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid #23334a;opacity:.45}.ach.on{opacity:1}.ach em{font-size:24px;font-style:normal}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}.tabs button{flex:none;border:1px solid var(--ln);background:#12213a;color:#b9d0ea;border-radius:99px;padding:7px 13px;font-size:13px}.tabs .on{background:var(--or);color:#2a1202;border-color:var(--or)}
details.c summary{cursor:pointer;font-weight:700}svg{width:100%;height:auto;display:block}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div class="w" id="app"></div><nav class="nav" id="nav"></nav>
<script>
const K='rlt_v2',RK=['Bronze I','Bronze II','Bronze III','Silver I','Silver II','Silver III','Gold I','Gold II','Gold III','Platinum I','Platinum II','Platinum III','Diamond I','Diamond II','Diamond III'],GI=12;
const SK0={'Wave Dash':4,'Fast Aerial':4,'Speed Flip':4,'Aéreo':3,'Recovery':3,'Drible (carregar a bola)':3,'Flick':2,'Defesa':3};
const SLV=['Não sabe','Iniciante','Básico','Intermediário','Executa bem','Dominado'];
const EX=[
['Aquecimento',10,'Solte as mãos e acorde os reflexos.','Ficar solto e preciso antes de jogar.',['Treino livre: wave dash, half flip e recoveries','Foque em boost bem usado, sem pressa'],'Recovery'],
['Controle de bola',20,'Carregar e controlar a bola em situações variadas.','Manter a posse por 10+ segundos.',['Ground dribble em linha reta e curvas','Bounce dribble com 3 toques seguidos','Treino livre com a bola parada, depois em movimento'],'Drible (carregar a bola)'],
['Flicks e finalizações',15,'Transformar o drible em chute forte e preciso.','Marcar 7 de 10 flicks no gol.',['Basic flick com a bola no carro','45 degree flick: ajuste o ângulo da inclinação','Powershot em bolas rolando'],'Flick'],
['Defesa',15,'Ler o atacante e cobrir o gol.','Defender sem desistir da posição.',['Shadow defense: recue sem se comprometer','Fake challenge: finja a disputa e espere','Goalkeeping: salve chutes de vários ângulos'],'Defesa'],
['Partidas competitivas',50,'Jogar 1v1 ranqueado com decisões conscientes.','Tomar decisões calmas, sem tilt.',['Jogue com plano: kickoff, posse, boost','Pare se perder 3 seguidas','Registre cada resultado na aba Ranking'],'Aéreo'],
['Análise de replay',10,'Rever a partida e achar o que corrigir.','Identificar 3 erros e como corrigi-los.',['Assista a uma derrota recente','Anote 3 erros de decisão, não de mecânica','Escolha 1 foco para a próxima sessão'],'Recovery']];
const MC=[
['Movimentação','Wave Dash',3,'Ganhar velocidade no pouso','Pouse de um salto com um flip rápido para a frente, mantendo o impulso.','Treino livre: salte, vire o carro e faça o flip ao tocar o chão'],
['Movimentação','Half Flip',3,'Virar o carro rápido sem perder velocidade','Flip para trás seguido de um giro de 180° cancelando a rotação.','Repita de parado e em movimento no campo vazio'],
['Movimentação','Speed Flip',4,'Kickoff mais rápido','Diagonal flip com cancelamento parcial para ganhar velocidade.','Pratique o kickoff diagonal em treino de kickoff'],
['Movimentação','Recovery',3,'Pousar sempre pronto para o próximo movimento','Ajustar o carro no ar para pousar nas rodas e já acelerar.','Pacotes de aéreos e saltos, pousando em wave dash'],
['Controle','Ground Dribble',2,'Carregar a bola no capô','Acompanhe a bola com pequenos ajustes de velocidade e direção.','Dribble em linha reta e em curvas largas'],
['Controle','Bounce Dribble',3,'Controlar a bola quicando','Toques leves no ar para manter a bola perto do carro.','3 toques seguidos, depois 5'],
['Controle','Ball Control',2,'Dominar a bola sem tirar a posse','Amortecer, parar e conduzir com a parte certa do carro.','Pratique parar a bola e virar'],
['Ataque','Basic Flick',2,'Chute forte a partir do drible','Levante a bola, salte e dê um flip para impulsioná-la.','10 flicks seguidos no gol vazio'],
['Ataque','45 Degree Flick',4,'Flick difícil de prever','Flick em ângulo, que faz a bola sair de lado com mais força.','Repita no gol com goleiro bot'],
['Ataque','Powershot',2,'Chute potente com a bola rolando','Posicione o carro e acerte no meio da bola com velocidade.','Treino de chutes com bolas vindo de lado'],
['Ataque','Aerial Shot',3,'Finalizar no ar','Salte e pegue a bola alta com um toque controlado.','Bolas altas no treino de aéreo'],
['Ataque','Fast Aerial',3,'Subir rápido com economia de boost','Salto duplo ao pressionar boost logo no início.','Aéreos curtos até a bola quicando'],
['Defesa','Shadow Defense',2,'Pressionar sem se comprometer','Recue em linha com o atacante, escolhendo o momento de agir.','Treino de defesa contra bot atacante'],
['Defesa','Fake Challenge',3,'Forçar o erro do atacante','Finja a disputa e espere o atacante errar a bola.','Pratique a hora de recuar e a hora de ir'],
['Defesa','Goalkeeping',3,'Salvar chutes de vários ângulos','Posicione o carro e use saltos e flips para cobrir o gol.','Treino de goleiro com chutes variados'],
['Defesa','50/50',3,'Ganhar disputas da bola','Chegue com velocidade e controle ao contato.','Disputas em campo vazio contra bot']];
const AC=[
['Primeira sessão concluída','Complete as 6 atividades em um dia',s=>Object.values(s.done).some(d=>Object.values(d).filter(Boolean).length>=6)],
['10 vitórias','Vença 10 partidas',s=>W(s)>=10],['50 vitórias','Vença 50 partidas',s=>W(s)>=50],['100 partidas','Registre 100 partidas',s=>s.m.length>=100],
['70% de aproveitamento','70% de vitórias com 10+ partidas',s=>s.m.length>=10&&W(s)/s.m.length>=.7],
['Primeiro Silver','Chegue ao Silver I',s=>s.max>=3],['Primeiro Gold','Chegue ao Gold I',s=>s.max>=6],['Primeiro Platinum','Chegue ao Platinum I',s=>s.max>=9],['Diamond I alcançado','Chegue ao Diamond I',s=>s.max>=GI]];
const W=s=>s.m.filter(x=>x.r=='w').length,dk=(d=new Date())=>d.toLocaleDateString('sv-SE');
let S=load(),tab='home',run=-1,ct='Todas';
function load(){let d={rank:0,mmr:0,goal:0,next:0,m:[],t:{},ex:{},done:{},sk:{...SK0},max:0};try{Object.assign(d,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}return d}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
const hm=s=>{const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?h+'h '+m+'min':m+' min'},clk=s=>[Math.floor(s/60),s%60].map(x=>String(x).padStart(2,'0')).join(':');
const tot=()=>Object.values(S.t).reduce((a,b)=>a+b,0);
function days(n){const o=[];for(let i=n-1;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);o.push(dk(d))}return o}
function bars(a,lab,col,b,col2){const w=300,h=120,n=a.length,mx=Math.max(1,...a,...(b||[0])),bw=w/n;let o=`<svg viewBox="0 0 ${w} ${h+18}">`;a.forEach((v,i)=>{const bh=v/mx*h,x=i*bw+4,ww=b?(bw-8)/2:bw-8;o+=`<rect x="${x}" y="${h-bh}" width="${ww}" height="${bh}" rx="3" fill="${col}"/>`;if(b){const bh2=b[i]/mx*h;o+=`<rect x="${x+ww}" y="${h-bh2}" width="${ww}" height="${bh2}" rx="3" fill="${col2}"/>`}o+=`<text x="${i*bw+bw/2}" y="${h+14}" font-size="10" fill="#91a2bb" text-anchor="middle">${lab[i]}</text>`});return o+'</svg>'}
function line(a){if(a.length<2)return'<div class="l">Registre pelo menos 2 partidas para ver o gráfico.</div>';const w=300,h=110,mn=Math.min(...a),mx=Math.max(...a),r=Math.max(1,mx-mn),p=a.map((v,i)=>`${i/(a.length-1)*w},${h-(v-mn)/r*(h-10)-5}`).join(' ');return`<svg viewBox="0 0 ${w} ${h}"><polyline points="${p}" fill="none" stroke="#ff8a32" stroke-width="3" stroke-linejoin="round"/></svg><div class="l">De ${mn} a ${mx} MMR</div>`}
function est(){const r=S.m.slice(0,20);if(r.length<3)return'Registre pelo menos 3 partidas para estimar.';const net=r.reduce((a,x)=>a+(x.r=='w'?x.d:-x.d),0)/r.length,t=S.next||S.goal;if(!t)return'Defina o MMR do próximo rank (campo acima) para estimar.';const rem=t-S.mmr;if(rem<=0)return'Você já passou desse MMR. Confira seu rank no jogo.';if(net<=0)return'Seu saldo recente de MMR por partida está zerado ou negativo. Estime de novo quando subir.';return`Faltam cerca de ${rem} MMR. No seu ritmo recente (${net.toFixed(1)} MMR por partida), são cerca de ${Math.ceil(rem/net)} partidas. É uma estimativa.`}
function low(){return Object.entries(S.sk).sort((a,b)=>a[1]-b[1])[0]}
function vHome(){const n=S.m.length,w=W(S),pct=S.goal>0?Math.min(100,S.mmr/S.goal*100):S.rank/GI*100,lw=low(),ex=EX.find(e=>e[5]==lw[0])||EX[2];
return`<div class="hero"><div class="l">Meta: Diamond I</div><h1>Treine. Evolua. Suba de rank.</h1><div class="rk" style="margin-top:14px">${RK[S.rank]} <b>◆</b></div><div class="l">MMR atual: <b style="color:#fff">${S.mmr}</b>${S.goal?' de '+S.goal:''}</div><div class="bar"><i style="width:${pct}%"></i></div><div class="l" style="margin-top:6px">${S.goal?'Progresso até seu MMR de meta':'Progresso na trilha de ranks'}: ${Math.round(pct)}%</div></div>
<h2>Seu desempenho</h2><div class="g"><div class="c"><div class="l">Partidas</div><div class="v bl">${n}</div></div><div class="c"><div class="l">Aproveitamento</div><div class="v gr">${n?Math.round(w/n*100)+'%':'—'}</div></div><div class="c"><div class="l">Vitórias</div><div class="v gr">${w}</div></div><div class="c"><div class="l">Derrotas</div><div class="v or">${n-w}</div></div><div class="c" style="grid-column:1/-1"><div class="l">Tempo total de treinamento</div><div class="v">${hm(tot())}</div></div></div>
<h2>Próxima meta</h2><div class="c"><b>Subir para ${RK[Math.min(S.rank+1,RK.length-1)]}</b><div class="l" style="margin:4px 0 10px">${est()}</div><div class="l">Foco sugerido: <b style="color:var(--or)">${lw[0]}</b> (${SLV[lw[1]]}). Treino: ${ex[0]}.</div><div class="row"><button class="btn" onclick="go('train')">Abrir treino de hoje</button></div></div>`}
function vTrain(){const k=dk(),d=S.done[k]||{},nd=EX.filter((_,i)=>d[i]).length;
return`<h2 style="margin-top:6px">Plano de hoje: 120 minutos</h2><div class="l">${nd} de 6 concluídos. Tempo treinado hoje: ${hm(S.t[k]||0)}</div><div class="c" style="margin-top:10px">`+EX.map((e,i)=>{const el=S.ex[k+'_'+i]||0,left=Math.max(0,e[1]*60-el);return`<div class="ex"><div class="top"><div><h3>${e[0]} <span class="tag o">${e[1]} min</span></h3></div><input class="chk" type="checkbox" ${d[i]?'checked':''} onchange="chk(${i},this.checked)" aria-label="Concluído"></div><div class="l" style="margin:4px 0">${e[2]}<br><b>Objetivo:</b> ${e[3]}</div><ul>${e[4].map(x=>`<li>${x}</li>`).join('')}</ul><div class="top" style="margin-top:10px"><span class="tm" id="tm${i}">${clk(left)}</span><button class="btn ${run==i?'d':'s'}" style="width:auto;padding:9px 18px" onclick="tg(${i})">${run==i?'Pausar':el?'Continuar':'Iniciar'}</button></div></div>`}).join('')+`</div>`}
function chk(i,v){const k=dk();(S.done[k]=S.done[k]||{})[i]=v;save();go('train',1)}
function tg(i){run=run==i?-1:i;go('train',1)}
setInterval(()=>{if(run<0)return;const k=dk(),e=EX[run],key=k+'_'+run;S.ex[key]=(S.ex[key]||0)+1;S.t[k]=(S.t[k]||0)+1;const left=e[1]*60-S.ex[key],el=document.getElementById('tm'+run);if(el)el.textContent=clk(Math.max(0,left));if(left<=0){(S.done[k]=S.done[k]||{})[run]=true;run=-1;save();go('train',1)}else if(S.ex[key]%10==0)save()},1000);
function vMech(){const cs=['Todas',...new Set(MC.map(m=>m[0]))];
return`<h2 style="margin-top:6px">Biblioteca de mecânicas</h2><div class="tabs">${cs.map(c=>`<button class="${c==ct?'on':''}" onclick="ct='${c}';go('mech',1)">${c}</button>`).join('')}</div><div style="margin-top:10px">`+MC.filter(m=>ct=='Todas'||m[0]==ct).map(m=>`<details class="c" style="margin-bottom:8px"><summary>${m[1]} <span class="tag ${m[2]>3?'r':'o'}">Dificuldade ${m[2]}/5</span></summary><p class="l" style="margin:8px 0"><b>Objetivo:</b> ${m[3]}</p><p style="font-size:13px;margin:6px 0">${m[4]}</p><p class="l"><b>Exercício:</b> ${m[5]}</p></details>`).join('')+`</div>
<h2>Seu perfil mecânico</h2><div class="c">`+Object.entries(S.sk).map(([n,v])=>`<div class="sk"><div style="flex:1"><b>${n}</b><div class="l">${SLV[v]}</div></div><div class="pips">${[1,2,3,4,5].map(i=>`<i class="${i<=v?'on':''}"></i>`).join('')}</div><button onclick="sk('${n}',-1)" aria-label="Diminuir">−</button><button onclick="sk('${n}',1)" aria-label="Aumentar">+</button></div>`).join('')+`</div>`}
function sk(n,d){S.sk[n]=Math.max(0,Math.min(5,S.sk[n]+d));save();go('mech',1)}
function vRank(){return`<h2 style="margin-top:6px">Ranking e MMR</h2><div class="c"><div class="f"><label>Rank atual</label><select onchange="rk(this.value)">${RK.map((r,i)=>`<option value="${i}" ${i==S.rank?'selected':''}>${r}</option>`).join('')}</select></div><div class="g"><div class="f"><label>MMR atual</label><input id="mm" type="number" value="${S.mmr}"></div><div class="f"><label>MMR de Diamond I (meta)</label><input id="gl" type="number" value="${S.goal||''}" placeholder="você define"></div></div><div class="f"><label>MMR do próximo rank</label><input id="nx" type="number" value="${S.next||''}" placeholder="você define"></div><button class="btn s" onclick="sv()">Salvar</button><div class="nt">Os valores de MMR por rank mudam conforme a temporada e o modo de jogo. Por isso você digita os seus. As estimativas são aproximadas.</div></div>
<h2>Registrar partida</h2><div class="c"><div class="f"><label>MMR ganho ou perdido</label><input id="dl" type="number" placeholder="ex.: 9"></div><div class="row"><button class="btn w2" onclick="am('w')">Vitória</button><button class="btn d" onclick="am('l')">Derrota</button></div></div>
<h2>Histórico</h2><div class="c">`+(S.m.length?S.m.slice(0,15).map(m=>`<div class="lg"><span>${m.r=='w'?'Vitória':'Derrota'} · ${m.dt}</span><span class="tag ${m.r=='w'?'':'r'}">${m.r=='w'?'+':'−'}${m.d} MMR</span></div>`).join(''):'<div class="l">Registre sua primeira partida acima.</div>')+`</div><div class="row"><button class="btn s" onclick="ex()">Exportar dados</button><button class="btn s" onclick="if(confirm('Apagar todo o progresso?')){S=load.call(0,localStorage.removeItem(K));save();go('rank')}">Apagar tudo</button></div>`}
function rk(i){S.rank=+i;S.max=Math.max(S.max,S.rank);save();go('rank',1)}
function sv(){S.mmr=Math.max(0,+document.getElementById('mm').value||0);S.goal=Math.max(0,+document.getElementById('gl').value||0);S.next=Math.max(0,+document.getElementById('nx').value||0);save();go('rank',1)}
function am(r){const d=Math.abs(+document.getElementById('dl').value||0);S.m.unshift({r,d,dt:dk(),mmr:Math.max(0,S.mmr+(r=='w'?d:-d))});S.mmr=S.m[0].mmr;save();go('rank',1)}
function ex(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='rocket-league-training.json';a.click()}
function vStats(){const D=days(7),lb=D.map(x=>x.slice(8)),cnt=(r)=>D.map(x=>S.m.filter(m=>m.dt==x&&(!r||m.r==r)).length),w=cnt('w'),l=cnt('l'),n=S.m.length;
return`<h2 style="margin-top:6px">Estatísticas</h2><div class="g"><div class="c"><div class="l">Aproveitamento</div><div class="v gr">${n?Math.round(W(S)/n*100)+'%':'—'}</div></div><div class="c"><div class="l">Treino acumulado</div><div class="v bl">${hm(tot())}</div></div></div>
<h2>Vitórias e derrotas por dia</h2><div class="c">${bars(w,lb,'#43d69a',l,'#ff6574')}<div class="l">Verde: vitórias · Vermelho: derrotas · últimos 7 dias</div></div>
<h2>MMR ao longo do tempo</h2><div class="c">${line([...S.m].reverse().map(m=>m.mmr))}</div>
<h2>Partidas por dia</h2><div class="c">${bars(cnt(),lb,'#36a8ff')}</div>
<h2>Minutos de treino por dia</h2><div class="c">${bars(D.map(x=>Math.round((S.t[x]||0)/60)),lb,'#ff8a32')}</div>
<h2>Evolução das habilidades</h2><div class="c">`+Object.entries(S.sk).map(([n,v])=>`<div class="sk"><b>${n}</b><div class="bar" style="flex:1;margin:0"><i style="width:${v/5*100}%"></i></div></div>`).join('')+`</div>`}
function vAch(){const u=AC.filter(a=>a[2](S)).length;return`<h2 style="margin-top:6px">Conquistas</h2><div class="l">${u} de ${AC.length} desbloqueadas</div><div class="c" style="margin-top:10px">`+AC.map(a=>{const o=a[2](S);return`<div class="ach ${o?'on':''}"><em>${o?'🏆':'🔒'}</em><div><b>${a[0]}</b><div class="l">${a[1]}</div></div></div>`}).join('')+`</div>`}
