name: Rocket League Training
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Preparar projeto Android
        run: |
          mkdir -p www assets
          cp index.html www/index.html
          cp icon.png assets/icon.png
          npm install
          npx cap add android
          npx @capacitor/assets generate --android --iconBackgroundColor '#09101e' --iconBackgroundColorDark '#09101e'
          npx cap sync android
      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: rocket-league-training-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
